name: Release

# Push a tag like v0.2.0 (or v0.2.0-beta.1 for a prerelease) to build the unsigned macOS app and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}. Bump the version, commit, then tag."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build-mac:
    name: Build unsigned macOS app
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

      - name: Package (arm64 and x64, unsigned)
        run: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # never pick up a certificate: these builds are unsigned on purpose

      - name: Checksums
        working-directory: dist
        run: shasum -a 256 *.dmg *.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: mini-coding-agent-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  build-win:
    name: Build unsigned Windows installer
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

      - name: Package (x64, unsigned)
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Checksums
        shell: bash
        working-directory: dist
        run: sha256sum *.exe > SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: mini-coding-agent-windows
          path: |
            dist/*.exe
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mini-coding-agent-macos
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: mini-coding-agent-windows
          path: release

      - name: Create the release with the GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          cat > notes.md <<'NOTES'
          ## Install (macOS, unsigned)

          This build is **not signed or notarized**, so macOS blocks it on first launch.

          1. Open the `.dmg` matching your Mac (`arm64` = Apple Silicon, `x64` = Intel) and drag the app to Applications.
          2. Remove the quarantine flag once: `xattr -dr com.apple.quarantine "/Applications/mini-coding-agent.app"`
             (or right-click the app, choose Open, then Open again; on macOS 15 use System Settings > Privacy & Security > Open Anyway).
          3. Verify the download against `SHA256SUMS.txt` if you like: `shasum -a 256 -c SHA256SUMS.txt`.

          ## Install (Windows, unsigned)

          Run the `.exe` installer. SmartScreen warns about unsigned apps: choose **More info**, then **Run anyway**.
          Install [Git for Windows](https://git-scm.com/download/win) so MCA can run commands in Git Bash; without it MCA falls back to PowerShell and asks before every command.

          ## Changes
          NOTES
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file notes.md \
            $flags
