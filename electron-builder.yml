appId: com.mca.minicodingagent
productName: mid-coding-agent
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts,components.json}'
mac:
  category: public.app-category.developer-tools
  identity: null # unsigned: no Apple Developer certificate is used
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - dmg
    - zip
  artifactName: '${productName}-${version}-${arch}.${ext}'
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: '${productName}-${version}-setup.${ext}'
  signAndEditExecutable: false # unsigned: no code-signing certificate is used
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
dmg:
  title: '${productName}'
asarUnpack:
  - node_modules/@vscode/ripgrep/bin/**
  - node_modules/@vscode/ripgrep-*/bin/**
npmRebuild: false
